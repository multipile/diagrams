name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Everything the flake checks: the build, the tests, clippy and rustfmt.
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --print-build-logs
