name: test diagrams

# Every case rendered, and shown in the pull request's description, so a
# review sees what a change does to the pictures.
on:
  pull_request:

permissions:
  contents: write # the pictures, stored on the assets/test-diagrams branch
  pull-requests: write # the gallery, in the description

concurrency:
  group: test-diagrams-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - run: nix build --print-build-logs
      - name: Render the cases, store the new pictures, and show them all
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # A pull request from a fork, or from Dependabot, gets a read-only
          # token: it renders, and publishes nothing.
          PUBLISH: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        run: .github/scripts/test-diagrams.sh result/bin/diagram crates/pipeline/cases
